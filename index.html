  ];
  const total = slides.length;
  let idx = 1;
  const img = document.getElementById('slideImg');
  const cur = document.getElementById('cur');
  const totalEl = document.getElementById('total');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const thumbs = document.getElementById('thumbs');

  totalEl.textContent = total;

  function render(){
    img.src = slides[idx-1];
    img.alt = `Slide ${idx}`;
    cur.textContent = idx;
    prevBtn.disabled = idx === 1;
    nextBtn.disabled = idx === total;
    [...thumbs.children].forEach((t,i)=> t.classList.toggle('active', i+1===idx));
    const active = thumbs.children[idx-1];
    if(active) active.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  for(let i=1;i<=total;i++){
    const t = document.createElement('img');
    t.src = slides[i-1];
    t.addEventListener('click', ()=>{ idx=i; render(); });
    thumbs.appendChild(t);
  }

  prevBtn.addEventListener('click', ()=>{ if(idx>1){ idx--; render(); } });
  nextBtn.addEventListener('click', ()=>{ if(idx<total){ idx++; render(); } });

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowRight') nextBtn.click();
    if(e.key === 'ArrowLeft') prevBtn.click();
  });

  let touchStartX = 0;
  document.querySelector('.viewer').addEventListener('touchstart', e=>{
    touchStartX = e.changedTouches[0].screenX;
  });
  document.querySelector('.viewer').addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].screenX - touchStartX;
    if(dx > 50) prevBtn.click();
    if(dx < -50) nextBtn.click();
  });

  render();
</script>
